name: Build

on:
  push:
    branches: [main]
    paths:
      - "gamemodes/**"
      - "tests/**"
      - "tools/check_pawn_output.py"
      - "tools/install_rustext.py"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libc6-i386

      - name: Obtain compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sdk"
          curl -fL --retry 3 \
            https://github.com/openmultiplayer/open.mp/releases/download/v1.5.8.3079/open.mp-linux-x86.tar.gz \
            -o "$RUNNER_TEMP/sdk.tar.gz"
          tar -xzf "$RUNNER_TEMP/sdk.tar.gz" -C "$RUNNER_TEMP/sdk"
          COMPILER=$(find "$RUNNER_TEMP/sdk" -type f -name pawncc | head -n 1)
          INCLUDE=$(find "$RUNNER_TEMP/sdk" -type f -name open.mp.inc | head -n 1)
          LIBPAWNC=$(find "$RUNNER_TEMP/sdk" -type f -name libpawnc.so | head -n 1)
          test -n "$COMPILER"
          test -n "$INCLUDE"
          test -n "$LIBPAWNC"
          echo "PAWN_COMPILER=$COMPILER" >> "$GITHUB_ENV"
          echo "PAWN_INCLUDE=$(dirname "$INCLUDE")" >> "$GITHUB_ENV"
          echo "PAWN_LIB=$(dirname "$LIBPAWNC")" >> "$GITHUB_ENV"

      - name: Stage source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          dest = Path("build/stage")
          dest.mkdir(parents=True, exist_ok=True)
          main = Path("gamemodes/signal0317.pwn")
          (dest / main.name).write_bytes(b"#define TARKENSO_DB_PRIMARY\n" + main.read_text(encoding="utf-8").encode("cp1251", errors="strict"))
          for source in sorted(Path("gamemodes/includes").glob("*.inc")):
              (dest / source.name).write_bytes(source.read_text(encoding="utf-8").encode("cp1251", errors="strict"))
          PY

      - name: Validate PayDay, character menu and Studio contracts
        run: |
          python3 -m unittest discover -s tests -p 'test_payday.py' -v
          python3 -m unittest discover -s tests -p 'test_story_prologue.py' -v
          python3 -m unittest discover -s tests -p 'test_death_respawn.py' -v
          python3 -m unittest discover -s tests -p 'test_story_audio.py' -v
          python3 -m unittest discover -s tests -p 'test_player_menu.py' -v
          python3 -m unittest discover -s tests -p 'test_radio_player.py' -v
          python3 -m unittest discover -s tests -p 'test_admin_vehicle.py' -v
          python3 -m unittest discover -s tests -p 'test_stunt_bonus.py' -v
          python3 -m unittest discover -s tests -p 'test_legacy_race_entries.py' -v
          python3 -m unittest discover -s tests -p 'test_standard_rewards_audit.py' -v
          python3 -m unittest discover -s tests -p 'test_admin_weather.py' -v
          python3 -m unittest discover -s tests -p 'test_rp_commands.py' -v
          python3 -m unittest discover -s tests -p 'test_local_chat.py' -v
          python3 -m unittest discover -s tests -p 'test_admin_tools.py' -v
          python3 -m unittest discover -s tests -p 'test_admin_tools2.py' -v
          python3 -m unittest discover -s tests -p 'test_admin_punish.py' -v
          python3 -m unittest discover -s tests -p 'test_cleaner_editor05.py' -v
          python3 -m unittest discover -s tests -p 'test_cleaner_truck01.py' -v
          python3 -m unittest discover -s tests -p 'test_cleaner_truck02.py' -v
          python3 -m unittest discover -s tests -p 'test_cleaner_truck03.py' -v
          python3 -m unittest discover -s tests -p 'test_truck_loading_hotfix.py' -v
          python3 -m unittest discover -s tests -p 'test_truck_alt_cargo_labels.py' -v
          python3 -m unittest discover -s tests -p 'test_cleaner_truck04.py' -v
          python3 -m unittest discover -s tests -p 'test_waste_sort.py' -v
          python3 -m unittest discover -s tests -p 'test_rustext_installer.py' -v
          python3 -m unittest discover -s tests -p 'test_studio_core.py' -v
          python3 -m unittest discover -s tests -p 'test_studio_stage2.py' -v
          python3 -m unittest discover -s tests -p 'test_ship_studio.py' -v
          python3 -m unittest discover -s tests -p 'test_ship_route_lssf.py' -v

      - name: Validate controlled NPC load test
        run: |
          python3 -m unittest discover -s tests -p 'test_load_test.py' -v

      - name: Validate stage 2 headless harness
        run: |
          python3 -m unittest discover -s tests -p 'test_loadtest_stage2.py' -v

      - name: Validate PC LoadNet worker
        run: |
          python3 -m unittest discover -s tests -p 'test_loadnet_worker.py' -v

      - name: Validate synthetic account benchmark and metrics
        run: |
          python3 -m unittest discover -s tests -p 'test_load_bench.py' -v

      - name: Compile source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$PAWN_COMPILER"
          export LD_LIBRARY_PATH="$PAWN_LIB:${LD_LIBRARY_PATH:-}"
          "$PAWN_COMPILER" "-i$PAWN_INCLUDE" "-ibuild/stage" "-obuild/compiled.amx" build/stage/signal0317.pwn 2>&1 | tee build/compiler.log
          python3 tools/check_pawn_output.py build/compiler.log
          test -s build/compiled.amx
          echo "MySQL-primary AMX: $(stat -c %s build/compiled.amx) bytes"

      - name: Upload compiled output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-output
          path: build/compiled.amx
          if-no-files-found: error
          retention-days: 3

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: build/compiler.log
          if-no-files-found: ignore
          retention-days: 3
