name: Build

on:
  push:
    branches: [main]
    paths:
      - "gamemodes/**"
      - "db/**"
      - "tests/**"
      - "data/payday/**"
      - "tools/export_payday_phrases.py"
      - "tools/check_pawn_output.py"
      - "tools/check_chat_style.py"
      - "tools/check_dialog_ids.py"
      - "tools/check_sql_security.py"
      - "tools/check_finance_sql_acl.py"
      - "tools/check_pawn_static.py"
      - "tools/check_pawn_complexity.py"
      - "tools/run_pawn_benchmark.py"
      - "tools/run_pawn_scaling.py"
      - "tools/install_rustext.py"
      - "tools/test_tdstudio.py"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sql_security:
    name: SQL Security Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test SQL injection detection
        run: python3 -m unittest discover -s tests -p 'test_sql_security.py' -v

      - name: Enforce SQL construction policy
        run: python3 tools/check_sql_security.py --output build/sql_security_report.json

      - name: Upload SQL security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sql-security-report
          path: build/sql_security_report.json
          if-no-files-found: warn
          retention-days: 14

  gov00_mysql_uat:
    name: GOV-00/01/02/03/04/05/06 MariaDB UAT
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: gov00-ci-only
          MARIADB_DATABASE: tarkenso_gov00
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GOV00_TEST_HOST: 127.0.0.1
      GOV00_TEST_USER: root
      GOV00_TEST_PASSWORD: gov00-ci-only
      GOV00_TEST_DB: tarkenso_gov00
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install MariaDB client and Python connector
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client
          python3 -m pip install --user mysql-connector-python

      - name: Apply isolated schema 001 + 017 + 018 + 019
        run: |
          set -euo pipefail
          for migration in 001_initial.sql 017_treasury_core.sql 018_gov_atomic_transfers.sql 019_bond_fund_core.sql; do
            mariadb --protocol=tcp -h 127.0.0.1 -P 3306 -uroot "-p$GOV00_TEST_PASSWORD" "$GOV00_TEST_DB" \
              < "db/migrations/$migration"
          done

      - name: Test GOV-00 atomicity and concurrent idempotent replay
        run: python3 tests/gov00_mysql_uat.py

      - name: Test GOV-01 guarantee capacity, fund accounting and protected debits
        run: python3 tests/gov01_mysql_uat.py

      - name: Apply migration 020 after GOV-01 regression UAT
        run: |
          mariadb --protocol=tcp -h 127.0.0.1 -P 3306 -uroot "-p$GOV00_TEST_PASSWORD" "$GOV00_TEST_DB" < db/migrations/020_government_bond_issues.sql

      - name: Test GOV-02 atomic approval, cancellation and immutable terms
        run: python3 tests/gov02_mysql_uat.py

      - name: Apply migration 021 after GOV-02 regression UAT
        run: |
          mariadb --protocol=tcp -h 127.0.0.1 -P 3306 -uroot "-p$GOV00_TEST_PASSWORD" "$GOV00_TEST_DB" < db/migrations/021_bond_settlement.sql

      - name: Test GOV-03 placement, maturity escrow and insurance
        run: python3 tests/gov03_mysql_uat.py
      
      - name: Apply migration 022 after GOV-03 regression UAT
        run: |
          mariadb --protocol=tcp -h 127.0.0.1 -P 3306 -uroot "-p$GOV00_TEST_PASSWORD" "$GOV00_TEST_DB" < db/migrations/022_bond_debt_crisis.sql

      - name: Test GOV-04 debt recovery, crisis and restructuring
        run: python3 tests/gov04_mysql_uat.py

      - name: Apply migration 023 after GOV-04 regression UAT
        run: |
          mariadb --protocol=tcp -h 127.0.0.1 -P 3306 -uroot "-p$GOV00_TEST_PASSWORD" "$GOV00_TEST_DB" < db/migrations/023_bond_governance.sql

      - name: Test GOV-05 auto-code and official authorization on MariaDB
        run: python3 tests/gov05_mysql_uat.py

      - name: Apply GOV-06 security migration 024 on disposable MariaDB
        run: |
          set -euo pipefail
          mariadb --protocol=tcp -h 127.0.0.1 -P 3306 -uroot "-p$GOV00_TEST_PASSWORD" "$GOV00_TEST_DB" < db/migrations/024_finance_assurance.sql

      - name: GOV-06 audit financial invariants, privileges and concurrent reads
        run: python3 tests/gov06_mysql_uat.py

      - name: GOV-06 runtime SQL ACL smoke (read-only; least-privilege vs root)
        env:
          GOV_ACL_DB_HOST: 127.0.0.1
          GOV_ACL_DB_NAME: tarkenso_gov00
          GOV_ACL_DB_USER: gov06_auditor
          GOV_ACL_DB_PASSWORD: ci-isolated-auditor-only
        run: |
          set -euo pipefail
          python3 tools/check_finance_sql_acl.py
          set +e
          GOV_ACL_DB_USER=root GOV_ACL_DB_PASSWORD="$GOV00_TEST_PASSWORD" python3 tools/check_finance_sql_acl.py
          acl_code=$?
          set -e
          if [ "$acl_code" -ne 1 ]; then
            echo "Expected explicit ACL rejection (exit 1), got $acl_code"
            exit 1
          fi

      - name: Apply GOV-05.1 revision + opening-clock migration 025 on disposable MariaDB
        run: |
          set -euo pipefail
          mariadb --protocol=tcp -h 127.0.0.1 -P 3306 -uroot "-p$GOV00_TEST_PASSWORD" "$GOV00_TEST_DB" < db/migrations/025_bond_application_revisions.sql

      - name: GOV-05.1 returned applications and delayed opening MariaDB UAT
        run: python3 tests/gov05_revision_mysql_uat.py

  compile:
    name: Compile
    needs: sql_security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check dialog ID collisions
        run: python3 tools/check_dialog_ids.py

      - name: Pawn static safety review (advisory)
        run: |
          python3 -m unittest discover -s tests -p 'test_pawn_static.py' -v
          python3 tools/check_pawn_static.py --output build/pawn_static_report.json

      - name: Pawn hot-path complexity guard (advisory)
        run: |
          python3 -m unittest discover -s tests -p 'test_pawn_performance.py' -v
          python3 tools/check_pawn_complexity.py --output build/pawn_complexity.json

      - name: Upload Pawn complexity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pawn-complexity-report
          path: build/pawn_complexity.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Pawn static review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pawn-static-report
          path: build/pawn_static_report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libc6-i386 lib32gcc-s1 lib32stdc++6 lib32atomic1

      - name: Obtain compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sdk"
          curl -fL --retry 3 \
            https://github.com/openmultiplayer/open.mp/releases/download/v1.5.8.3079/open.mp-linux-x86.tar.gz \
            -o "$RUNNER_TEMP/sdk.tar.gz"
          tar -xzf "$RUNNER_TEMP/sdk.tar.gz" -C "$RUNNER_TEMP/sdk"
          COMPILER=$(find "$RUNNER_TEMP/sdk" -type f -name pawncc | head -n 1)
          INCLUDE=$(find "$RUNNER_TEMP/sdk" -type f -name open.mp.inc | head -n 1)
          LIBPAWNC=$(find "$RUNNER_TEMP/sdk" -type f -name libpawnc.so | head -n 1)
          test -n "$COMPILER"
          test -n "$INCLUDE"
          test -n "$LIBPAWNC"
          echo "PAWN_COMPILER=$COMPILER" >> "$GITHUB_ENV"
          echo "PAWN_INCLUDE=$(dirname "$INCLUDE")" >> "$GITHUB_ENV"
          echo "PAWN_LIB=$(dirname "$LIBPAWNC")" >> "$GITHUB_ENV"
          echo "OMP_SERVER_DIR=$(dirname "$(dirname "$COMPILER")")" >> "$GITHUB_ENV"

      - name: Audit chat style
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          python3 -m unittest discover -s tests -p 'test_chat_style.py' -v
          python3 tools/check_chat_style.py --base origin/main

      - name: Compare baseline and PR Pawn AMX performance (advisory)
        run: |
          export LD_LIBRARY_PATH="$PAWN_LIB:${LD_LIBRARY_PATH:-}"
          python3 tools/run_pawn_benchmark.py --server "$OMP_SERVER_DIR" \
            --baseline-ref origin/main --output build

      - name: Compare synthetic 100/250/500-player AMX scaling (advisory)
        run: |
          export LD_LIBRARY_PATH="$PAWN_LIB:${LD_LIBRARY_PATH:-}"
          python3 -m unittest discover -s tests -p 'test_pawn_scaling.py' -v
          python3 tools/run_pawn_scaling.py --server "$OMP_SERVER_DIR" \
            --baseline-ref origin/main --output build

      - name: Upload Pawn scaling report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pawn-scaling-report
          path: |
            build/pawn_scaling_bench.json
            build/scaling-*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Pawn AMX performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pawn-performance-report
          path: |
            build/pawn_perf_bench.json
            build/perf-*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Stage source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          dest = Path("build/stage")
          dest.mkdir(parents=True, exist_ok=True)
          main = Path("gamemodes/signal0317.pwn")
          (dest / main.name).write_bytes(b"#define TARKENSO_DB_PRIMARY\n" + main.read_text(encoding="utf-8").encode("cp1251", errors="strict"))
          for source in sorted(Path("gamemodes/includes").glob("*.inc")):
              (dest / source.name).write_bytes(source.read_text(encoding="utf-8").encode("cp1251", errors="strict"))
          PY

      - name: Export PayDay level-up phrases (CP1251)
        run: python3 tools/export_payday_phrases.py

      - name: Validate all Python contracts and tools
        run: |
          python3 -m compileall -q tools tests
          python3 -m unittest discover -s tests -v

      - name: Run TextDraw Studio Pawn behavior tests
        run: |
          export LD_LIBRARY_PATH="$PAWN_LIB:${LD_LIBRARY_PATH:-}"
          python3 tools/test_tdstudio.py --server "$OMP_SERVER_DIR"

      - name: Validate stage 2 headless harness
        run: |
          python3 -m unittest discover -s tests -p 'test_loadtest_stage2.py' -v

      - name: Validate PC LoadNet worker
        run: |
          python3 -m unittest discover -s tests -p 'test_loadnet_worker.py' -v

      - name: Validate synthetic account benchmark and metrics
        run: |
          python3 -m unittest discover -s tests -p 'test_load_bench.py' -v

      - name: Validate migration version ownership
        run: python3 -m unittest discover -s tests -p 'test_migration_sequence.py' -v

      - name: Validate sustained load simulation
        run: python3 -m unittest discover -s tests -p 'test_load_continuous.py' -v

      - name: Validate auth login profiler
        run: python3 -m unittest discover -s tests -p 'test_auth_profiler.py' -v

      - name: Validate UTF-8 Russian console logging
        run: |
          python3 -m unittest discover -s tests -p 'test_console_ru.py' -v
          python3 -m unittest discover -s tests -p 'test_server_console_encoding.py' -v

      - name: Compile source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$PAWN_COMPILER"
          export LD_LIBRARY_PATH="$PAWN_LIB:${LD_LIBRARY_PATH:-}"
          "$PAWN_COMPILER" "-i$PAWN_INCLUDE" "-ibuild/stage" "-obuild/compiled.amx" build/stage/signal0317.pwn 2>&1 | tee build/compiler.log
          python3 tools/check_pawn_output.py build/compiler.log
          test -s build/compiled.amx
          echo "MySQL-primary AMX: $(stat -c %s build/compiled.amx) bytes"

      - name: Upload compiled output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-output
          path: |
            build/compiled.amx
            build/scriptfiles/payday_levelup.txt
          if-no-files-found: error
          retention-days: 3

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: |
            build/compiler.log
            build/tdstudio-test-compile.log
            build/tdstudio-test-run.log
          if-no-files-found: ignore
          retention-days: 3
