name: Payload validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate public tree
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_public_tree.py
