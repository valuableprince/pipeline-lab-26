name: Payload validation
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run synthetic safety tests
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Validate tracked files and payload format
        run: python3 tools/verify_public_tree.py
